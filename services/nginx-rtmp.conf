load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes 1;
error_log /opt/StreamHub/data/logs/nginx-rtmp-error.log info;
pid /run/streamhub-rtmp/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    access_log /opt/StreamHub/data/logs/nginx-rtmp-ingest-access.log;

    server {
        listen 1935;
        chunk_size 4096;
        max_message 16M;
        ping 30s;
        notify_method post;

        application live {
            live on;
            record off;
            wait_key on;
            wait_video on;
            idle_streams off;
            drop_idle_publisher 10s;
            meta copy;

            allow publish all;
            allow play all;

            on_publish http://127.0.0.1:18080/api/rtmp/on_publish;
            on_publish_done http://127.0.0.1:18080/api/rtmp/on_publish_done;
        }
    }
}

http {
    access_log /opt/StreamHub/data/logs/nginx-rtmp-access.log;

    server {
        listen 127.0.0.1:18081;
        server_name localhost;

        location = /health {
            default_type text/plain;
            return 200 "streamhub-rtmp ok\n";
        }

        location /rtmp-stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }
    }
}
